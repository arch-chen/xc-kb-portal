# ============================================================
# kb-portal 部署必备的 nginx 规则
#
# 用法（二选一）：
#   A) 复制：宝塔 → 网站 → 设置 → 配置文件，把下面的 location 段
#      粘到 server { } 里面，保存并重载 nginx。
#   B) 引用：在 server { } 里只写一行
#        include /www/wwwroot/你的站点目录/nginx.example.conf;
#      然后重载 nginx（改这个文件后也要重载才生效）。
#
# 为什么必须加：storage/ 下是 SQLite 数据库与备份，data/ 下是种子 CSV。
# nginx 默认把它们当静态文件直接发出去，不需要任何账号或 Key，
# 一条 URL 就能把整库下载走。nginx 不读 .htaccess，只能在配置里拦。
#
# 验证：浏览器打开 https://你的域名/storage/kb.sqlite 必须是 404。
# ============================================================

# 1) 代码与数据目录一律不对外（目录列表也要关，避免被枚举文件名）
location ~ ^/(app|data|storage|migrations|tools|examples)/ {
    deny all;
    return 404;
}

# 2) 危险扩展名一律不对外（备份名、导出文件、日志、配置样例）
location ~* \.(sqlite|sqlite3|db|db-wal|db-shm|csv|log|lock|bak|zip|sql|md|conf)$ {
    deny all;
    return 404;
}

# 3) 可选：短地址。不配也能用 /api.php?path=/v1/...、/mcp.php、/llms.php
location = /llms.txt {
    rewrite ^ /llms.php last;
}
location = /mcp {
    rewrite ^ /mcp.php last;
}

# 4) 可选：后台传更新包时放宽上传体积（默认 1m 会在传包时报 413）
# client_max_body_size 20m;
